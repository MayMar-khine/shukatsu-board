<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mei's 就活 Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: a planner page (手帳) on baby-yellow graph paper. Pipeline + upcoming on top, then columns headed by masking-tape labels holding index cards. Single light look by choice. */
:root{
  color-scheme:light;
  --bg:#fff7d1; --grid:rgba(150,120,30,.09); --paper:#fffdf4; --col:rgba(255,253,244,.6);
  --fg:#2f2a21; --muted:#7d7258; --line:#e2d394; --ink:#2f2a21;
  --accent:#2f2a21; --accent-ink:#fff7d1; --hot:#cc4436; --warn:#b4741a; --ok:#3f8a4a;
  --s1:#d9d2bd; --s2:#ffd66b; --s3:#a6d4ee; --s4:#f4b0c8; --s5:#b3dfa2; --s6:#e3ded2;
  --f-display:"Klee One","Zen Kaku Gothic New",cursive;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4.2vw,40px);line-height:1.15;margin:0;text-wrap:balance}
h1 .mark{background:linear-gradient(transparent 58%,var(--s2) 58%,var(--s2) 92%,transparent 92%);padding:0 4px}
h1 small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--paper);color:var(--fg);padding:7px 14px;border-radius:3px;font-weight:500;box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--hot);border-color:var(--hot);box-shadow:2px 2px 0 var(--hot)}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.tabs{display:inline-flex;gap:14px;margin-right:8px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:4px 2px;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--fg);background:linear-gradient(transparent 60%,var(--s2) 60%)}

/* summary */
.summary{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.summary{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:16px 18px;min-width:0;box-shadow:4px 4px 0 var(--line)}
.label{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 10px}
.pipe{display:flex;height:16px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--paper)}
.pipe span{display:block;height:100%;border-right:1.5px solid var(--ink)}
.pipe span:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px}
.legend i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:2px;display:inline-block}
.legend b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.upcoming{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.upcoming li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:baseline}
.days{white-space:nowrap;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;font-weight:500;padding:1px 8px;border:1.5px solid var(--muted);border-radius:999px;text-align:center;color:var(--muted)}
.days.soon{color:var(--hot);border-color:var(--hot);transform:rotate(-3deg);font-weight:700}
.days.mid{color:var(--warn);border-color:var(--warn)}
.days.past{text-decoration:line-through}
.upcoming .what{overflow-wrap:anywhere}
.upcoming .what b{font-weight:700}
.empty-note{color:var(--muted);font-size:13px;margin:0}

/* board */
.board-scroll{overflow-x:auto;padding:6px 4px 10px;margin:0 -4px}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:14px;min-width:min-content}
.col{background:var(--col);border:1.5px dashed var(--line);border-radius:3px;padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.col.drop{border-color:var(--ink);background:var(--paper)}
.col h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:-8px 0 0 -4px;align-self:flex-start;display:flex;align-items:center;gap:10px;background:var(--stage);padding:3px 14px;transform:rotate(-1.5deg);opacity:.95;clip-path:polygon(0 0,100% 0,97% 50%,100% 100%,0 100%,3% 50%)}
.col h2 .dot{display:none}
.col h2 .n{font-family:var(--f-mono);font-size:12px;font-weight:500}
.col .hint{font-size:12px;color:var(--muted);margin:0 2px}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:10px 12px;box-shadow:3px 3px 0 var(--line);text-align:left;color:var(--fg);display:grid;gap:6px;width:100%;transition:transform .1s}
.card:hover{transform:rotate(-.6deg) translateY(-1px)}
.card[draggable="true"]{cursor:grab}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .co{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.card .stars{color:var(--warn);font-size:12px;letter-spacing:1px;white-space:nowrap}
.card .role{color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:0 7px;border:1px solid var(--line);border-radius:2px;color:var(--muted);font-weight:500}
.chip.intern{background:var(--s4);border-color:transparent;color:var(--fg)}
.chip.grad{background:var(--s3);border-color:transparent;color:var(--fg)}
.next{font-size:13px;border-top:1.5px dotted var(--line);padding-top:6px;display:flex;gap:6px;align-items:center;justify-content:space-between}
.next span:first-child{overflow-wrap:anywhere;min-width:0}
.addcol{border:1.5px dashed var(--muted);background:transparent;color:var(--muted);border-radius:2px;padding:7px;font-size:13px}
.addcol:hover{color:var(--fg);border-color:var(--ink);background:var(--paper)}

/* compare */
.tablewrap{overflow-x:auto;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;box-shadow:4px 4px 0 var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-display);font-size:14px;font-weight:600;border-bottom:1.5px solid var(--ink)}
tr:last-child td{border-bottom:0}
td.co{font-weight:700;white-space:nowrap}
td .stagepill{display:inline-block;padding:0 9px;font-size:12px;font-weight:700;color:var(--fg);background:var(--stage);border-radius:2px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(60,50,20,.35);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--paper);color:var(--fg);border:1.5px solid var(--ink);border-radius:3px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:6px 6px 0 var(--ink)}
.dialog h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:#fffef9;border:1.5px solid var(--line);border-radius:2px;padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:84px;resize:vertical;background-image:linear-gradient(transparent 23px,var(--line) 24px);background-size:100% 24px;line-height:24px}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.foot .right{display:flex;gap:10px;margin-left:auto}
.confirm{font-size:13px;color:var(--hot);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--hot)}
.link{color:var(--fg);text-decoration-color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1><span class="mark">Mei's 就活 Board</span><small>28卒 · tech roles in Japan · drag cards between columns or tap one to edit</small></h1>
    <div class="actions">
      <div class="tabs" role="tablist">
        <button id="tab-board" role="tab" aria-selected="true">Board</button>
        <button id="tab-compare" role="tab" aria-selected="false">Compare</button>
      </div>
      <button class="btn" id="export-btn" title="Save a backup file you can open on another device">Export</button>
      <button class="btn" id="import-btn" title="Load a backup file">Import</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button class="btn primary" id="add-btn">+ Add company</button>
    </div>
  </header>

  <section class="summary">
    <div class="panel">
      <p class="label">Pipeline</p>
      <div class="pipe" id="pipe"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <p class="label">Coming up</p>
      <ul class="upcoming" id="upcoming"></ul>
    </div>
  </section>

  <section id="view-board">
    <div class="board-scroll"><div class="board" id="board"></div></div>
  </section>
  <section id="view-compare" hidden>
    <div class="tablewrap"><table>
      <thead><tr><th>Company</th><th>Stage</th><th>Pay</th><th>Housing</th><th>Location</th><th>Interest</th></tr></thead>
      <tbody id="compare"></tbody>
    </table></div>
  </section>
  <p class="status" id="status">Loading your companies…</p>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="dialog" id="form" autocomplete="off">
    <h3 id="form-title">Edit company</h3>
    <div class="grid2">
      <div class="field"><label for="f-company">Company</label><input id="f-company" required placeholder="e.g. AWS Japan"></div>
      <div class="field"><label for="f-role">Role / course</label><input id="f-role" placeholder="e.g. Support Engineer"></div>
      <div class="field"><label for="f-stage">Stage</label><select id="f-stage"></select></div>
      <div class="field"><label for="f-kind">Type</label><select id="f-kind"><option value="grad">本選考 (new grad)</option><option value="intern">インターン</option></select></div>
      <div class="field"><label for="f-next">Next step</label><input id="f-next" placeholder="e.g. Submit ES"></div>
      <div class="field"><label for="f-deadline">Next step date</label><input id="f-deadline" type="date"></div>
      <div class="field"><label for="f-location">Location</label><input id="f-location"></div>
      <div class="field"><label for="f-interest">Interest</label><select id="f-interest"><option value="3">★★★ Top choice</option><option value="2">★★ Interested</option><option value="1">★ Maybe</option></select></div>
      <div class="field"><label for="f-pay">Pay</label><input id="f-pay"></div>
      <div class="field"><label for="f-housing">Housing / benefits</label><input id="f-housing"></div>
      <div class="field full"><label for="f-link">Link</label><input id="f-link" type="url" placeholder="https://"></div>
      <div class="field full"><label for="f-notes">Notes</label><textarea id="f-notes"></textarea></div>
    </div>
    <div class="foot">
      <div id="del-zone"><button type="button" class="btn danger" id="del-btn">Delete</button></div>
      <div class="right"><button type="button" class="btn" id="cancel-btn">Cancel</button><button type="submit" class="btn primary">Save</button></div>
    </div>
  </form>
</div>

<script>
const STAGES=[
  {id:"interested",name:"Interested",hint:"Researching or waiting for a posting",c:"--s1"},
  {id:"preparing",name:"Preparing",hint:"ES, SPI, portfolio",c:"--s2"},
  {id:"applied",name:"Applied",hint:"Submitted, waiting",c:"--s3"},
  {id:"interview",name:"Interviews",hint:"Tests and interviews",c:"--s4"},
  {id:"offer",name:"Offer",hint:"内定 / internship accepted",c:"--s5"},
  {id:"closed",name:"Closed",hint:"Declined or not selected",c:"--s6"}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let rows=[], editing=null, loaded=false;
const stageOf=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function daysLeft(iso){if(!iso)return null;const d=new Date(iso+"T00:00:00");return Math.round((d-today())/864e5)}
function daysBadge(iso){const n=daysLeft(iso);if(n===null)return "";const cls=n<0?"past":n<=7?"soon":n<=21?"mid":"";const t=n<0?`${-n}日前`:n===0?"今日":`あと${n}日`;return `<span class="days ${cls}">${t}</span>`}
const stars=n=>"★".repeat(+n||0);

function render(){
  // pipeline
  const counts=STAGES.map(s=>rows.filter(r=>r.stage===s.id).length);
  $("#pipe").innerHTML=STAGES.map((s,i)=>counts[i]?`<span style="flex-grow:${counts[i]};background:var(${s.c})" title="${s.name}: ${counts[i]}"></span>`:"").join("");
  $("#legend").innerHTML=STAGES.map((s,i)=>`<div><i style="background:var(${s.c})"></i>${s.name} <b>${counts[i]}</b></div>`).join("");
  // upcoming
  const up=rows.filter(r=>r.deadline&&r.stage!=="closed").sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5);
  $("#upcoming").innerHTML=up.length?up.map(r=>`<li>${daysBadge(r.deadline)}<span class="what"><b>${esc(r.company)}</b> · ${esc(r.next||"Next step")}</span></li>`).join("")
    :`<li style="display:block"><p class="empty-note">No dates yet. Open a card and set a "Next step date" (ES deadline, test, interview) and it shows up here with a countdown.</p></li>`;
  // board
  $("#board").innerHTML=STAGES.map(s=>{
    const list=rows.filter(r=>r.stage===s.id).sort((a,b)=>(b.interest||0)-(a.interest||0)||(a.deadline||"9").localeCompare(b.deadline||"9"));
    return `<div class="col" data-stage="${s.id}" style="--stage:var(${s.c})"><h2><span class="dot" style="background:var(${s.c})"></span>${s.name}<span class="n">${list.length}</span></h2><p class="hint">${s.hint}</p>
      ${list.map(r=>`<button class="card" draggable="true" data-id="${esc(r.id)}" style="--stage:var(${s.c})">
        <div class="top"><span class="co">${esc(r.company)}</span><span class="stars">${stars(r.interest)}</span></div>
        ${r.role?`<div class="role">${esc(r.role)}</div>`:""}
        <div class="chips"><span class="chip ${r.kind==="intern"?"intern":"grad"}">${r.kind==="intern"?"インターン":"本選考"}</span>${r.location?`<span class="chip">${esc(r.location)}</span>`:""}</div>
        ${r.next||r.deadline?`<div class="next"><span>→ ${esc(r.next||"")}</span>${daysBadge(r.deadline)}</div>`:""}
      </button>`).join("")}
      <button class="addcol" data-add="${s.id}">+ Add</button></div>`}).join("");
  // compare
  const sorted=[...rows].sort((a,b)=>STAGES.findIndex(s=>s.id===a.stage)-STAGES.findIndex(s=>s.id===b.stage)||(b.interest||0)-(a.interest||0));
  $("#compare").innerHTML=sorted.length?sorted.map(r=>`<tr><td class="co">${esc(r.company)}${r.link?`<br><a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">link</a>`:""}</td><td><span class="stagepill" style="--stage:var(${stageOf(r.stage).c})">${stageOf(r.stage).name}</span></td><td>${esc(r.pay)||"—"}</td><td>${esc(r.housing)||"—"}</td><td>${esc(r.location)||"—"}</td><td>${stars(r.interest)}</td></tr>`).join("")
    :`<tr><td colspan="6" class="empty-note">Add a company to compare pay and housing side by side.</td></tr>`;
  if(loaded) $("#status").textContent=rows.length?`${rows.length} companies · saved in this browser · use Export to back up or move to another device`:"No companies yet. Press “+ Add company”, or Import a backup file.";
}

// dialog
$("#f-stage").innerHTML=STAGES.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
const F=["company","role","stage","kind","next","deadline","location","interest","pay","housing","link","notes"];
function openForm(r,stage){
  editing=r?r.id:null;
  $("#form-title").textContent=r?r.company:"Add company";
  const base=r||{stage:stage||"interested",kind:"grad",interest:"2"};
  F.forEach(k=>$("#f-"+k).value=base[k]??"");
  resetDel(); $("#del-zone").hidden=!r;
  $("#scrim").hidden=false; $("#f-company").focus();
}
function closeForm(){$("#scrim").hidden=true;editing=null}
function resetDel(){$("#del-zone").innerHTML=`<button type="button" class="btn danger" id="del-btn">Delete</button>`}
$("#cancel-btn").onclick=closeForm;
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)closeForm()});
$("#del-zone").addEventListener("click",async e=>{
  if(e.target.id==="del-btn"){$("#del-zone").innerHTML=`<span class="confirm">Delete this company? <button type="button" class="btn danger" id="del-yes">Yes, delete</button><button type="button" class="btn" id="del-no">Keep</button></span>`}
  else if(e.target.id==="del-no")resetDel();
  else if(e.target.id==="del-yes"&&editing){const id=editing;closeForm();rows=rows.filter(r=>r.id!==id);render();try{await col.doc(id).delete()}catch(err){fail(err)}}
});
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const data={};F.forEach(k=>data[k]=$("#f-"+k).value.trim());
  data.interest=+data.interest||1; data.updatedAt=new Date().toISOString();
  const id=editing||(data.company.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"co")+"-"+Date.now().toString(36);
  closeForm();
  const i=rows.findIndex(r=>r.id===id); if(i>=0)rows[i]={...data,id};else rows.push({...data,id}); render();
    try{await col.doc(id).set(data)}catch(err){fail(err)}
});
function fail(err){$("#status").textContent="That change didn't save. Try again, or use Export to keep a backup.";$("#status").className="status err"}

// board interactions
$("#board").addEventListener("click",e=>{
  const a=e.target.closest("[data-add]"); if(a)return openForm(null,a.dataset.add);
  const c=e.target.closest(".card"); if(c)openForm(rows.find(r=>r.id===c.dataset.id));
});
let dragId=null;
$("#board").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed="move"}});
$("#board").addEventListener("dragover",e=>{const c=e.target.closest(".col");if(c&&dragId){e.preventDefault();document.querySelectorAll(".col.drop").forEach(x=>x!==c&&x.classList.remove("drop"));c.classList.add("drop")}});
$("#board").addEventListener("dragleave",e=>{const c=e.target.closest(".col");if(c&&!c.contains(e.relatedTarget))c.classList.remove("drop")});
$("#board").addEventListener("drop",async e=>{
  const c=e.target.closest(".col"); if(!c||!dragId)return; e.preventDefault(); c.classList.remove("drop");
  const r=rows.find(x=>x.id===dragId); const id=dragId; dragId=null;
  if(!r||r.stage===c.dataset.stage)return;
  r.stage=c.dataset.stage; render();
  if(col)try{await col.doc(id).update({stage:r.stage,updatedAt:new Date().toISOString()})}catch(err){fail(err)}
});
$("#board").addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"))});

// tabs
function tab(which){
  try{localStorage.setItem("tab",which)}catch(e){}
  $("#tab-board").setAttribute("aria-selected",which==="board");$("#tab-compare").setAttribute("aria-selected",which==="compare");
  $("#view-board").hidden=which!=="board";$("#view-compare").hidden=which!=="compare";
}
$("#tab-board").onclick=()=>tab("board");$("#tab-compare").onclick=()=>tab("compare");
try{if(localStorage.getItem("tab")==="compare")tab("compare")}catch(e){}
$("#add-btn").onclick=()=>openForm(null);

// ---- storage: this browser only (localStorage) ----
const KEY="shukatsu-board-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(rows));return true}catch(e){$("#status").textContent="Your browser blocked saving. Use Export to keep a backup.";$("#status").className="status err";return false}}
const col={doc:id=>({
  set:async d=>{const i=rows.findIndex(r=>r.id===id);const v={...d,id};if(i>=0)rows[i]=v;else rows.push(v);persist()},
  update:async d=>{const r=rows.find(r=>r.id===id);if(r)Object.assign(r,d);persist()},
  delete:async()=>{rows=rows.filter(r=>r.id!==id);persist()}
})};
$("#export-btn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"shukatsu-board",exportedAt:new Date().toISOString(),companies:rows},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="shukatsu-board-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("#import-btn").onclick=()=>$("#import-file").click();
$("#import-file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.companies;
    if(!Array.isArray(list))throw 0;
    rows=list.filter(r=>r&&r.id&&r.company);persist();render();
    $("#status").textContent=`Imported ${rows.length} companies from ${f.name}.`;$("#status").className="status";
  }catch(err){$("#status").textContent="That file isn't a board backup. Choose a .json file made with Export.";$("#status").className="status err"}
  e.target.value="";
};
rows=load()||[];loaded=true;render();
window.addEventListener("storage",e=>{if(e.key===KEY){rows=load()||[];render()}});
</script>

</body>
</html>
